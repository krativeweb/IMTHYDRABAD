name: Deploy SSR (Private Repo)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.203.127.190
          username: Am4DiLNbs9P0aCnA
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/imt-hyderabad-test/public_html
            pm2 stop imt-hyderabad-test || true
            rm -rf .next node_modules
            git pull origin main
            npm install --omit=dev
            npm run build
            PORT=3000 pm2 start npm --name "imt-hyderabad-test" -- start
            pm2 save
            echo "Deployed at $(date)"
