        with:
          host: 13.203.127.190
          username: Am4DiLNbs9P0aCnA
          port: 22
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/imt-hyderabad-test/public_html
            echo "Deploying at $(date)"

