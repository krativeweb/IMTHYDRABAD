name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.203.127.190
          username: Am4DiLNbs9P0aCnA
          port: 22
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            echo "🚀 Deploy started at $(date)"

            cd ~/imt-hyderabad-test/public_html || exit 1

            # Reset repo
            git fetch origin main
            git reset --hard origin/main

            # Clean old build
            rm -rf .next

            # Install dependencies (IMPORTANT)
            npm ci

            # Build Next.js
            npm run build

            # Restart app safely
            pm2 restart imt-hyderabad-test || pm2 start npm --name imt-hyderabad-test -- start

            pm2 save

            echo "✅ Deploy finished successfully!"
